[package]
name = "glucose"
version = "4.0.0"
description = "A minimalist video player"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant, but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "glucose_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = ["protocol-asset"] }
tauri-plugin-opener = "2.5.3"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
tauri-plugin-process = "2.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0.1"
urlencoding = "2.1.3"
whisper-rs = "0.16.0"
# On-device subtitle translation (CTranslate2). Patched copy, see vendor/ct2rs/GLUCOSE_PATCHES.txt.
ct2rs = { version = "0.10.1", default-features = false, features = ["ruy", "sentencepiece"] }
tokio = { version = "1.51.0", features = ["full"] }
# Face detection for smart subtitle placement (pure Rust ONNX inference).
tract-onnx = "0.21.19"
reqwest = { version = "0.13.2", features = ["stream"] }
futures-util = "0.3.32"
# Checks downloaded translation models against their known checksums.
sha2 = "0.10.9"
anyhow = "1.0"
fs4 = "1"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-updater = "2.10.0"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_System_Registry", "Win32_System_SystemInformation"] }

[patch.crates-io]
ct2rs = { path = "vendor/ct2rs" }

# Face detection is far too slow unoptimised (about 1 s per frame instead of 30 ms), so
# dev builds optimise the inference crates too. Release builds are unaffected.
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-data]
opt-level = 3
[profile.dev.package.tract-hir]
opt-level = 3
[profile.dev.package.tract-onnx]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
[profile.dev.package.tract-nnef]
opt-level = 3
[profile.dev.package.tract-onnx-opl]
opt-level = 3
[profile.dev.package.half]
opt-level = 3
[profile.dev.package.num-traits]
opt-level = 3
[profile.dev.package.num-complex]
opt-level = 3
[profile.dev.package.smallvec]
opt-level = 3
[profile.dev.package.matrixmultiply]
opt-level = 3
[profile.dev.package.libm]
opt-level = 3

# Whisper, CTranslate2 and the face model make the app much larger than it used to be, so
# release builds trade build time for size: link-time optimisation across crates, one
# code unit per crate, and no debug symbols in the executable.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
